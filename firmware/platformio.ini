[platformio]
default_envs = esp32dev

[env:esp32dev]
build_src_filter = +<main.cpp>
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
extra_scripts = pre:tools/build_identity.py
lib_deps =
  LSatan/SmartRC-CC1101-Driver-Lib@^2.5.7
build_flags =
  -DCORE_DEBUG_LEVEL=1

; Host capture tool dependency: pip install pyserial

; Separate OBD diagnostic test; the RF decoder image remains unchanged.
[env:esp32_obd_tpms]
extends = env:esp32dev
build_src_filter = +<obd_tpms.cpp>
