name: Collect Reference APKs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

env:
  OUT_DIR: reference-apks

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare output
        run: mkdir -p "$OUT_DIR"

      - name: Download OpenLauncher APK
        shell: bash
        run: |
          set -euo pipefail
          url=$(curl -fsSL https://api.github.com/repos/dw2lam/openlauncher/releases/latest | jq -r '.assets[] | select(.name|endswith(".apk")) | .browser_download_url' | head -n1)
          test -n "$url" && test "$url" != "null"
          curl -fL "$url" -o "$OUT_DIR/OpenLauncher.apk"

      - name: Download MBCompass APK
        shell: bash
        run: |
          set -euo pipefail
          url=$(curl -fsSL https://api.github.com/repos/CompassMB/MBCompass/releases/latest | jq -r '.assets[] | select(.name|endswith(".apk")) | .browser_download_url' | head -n1)
          test -n "$url" && test "$url" != "null"
          curl -fL "$url" -o "$OUT_DIR/MBCompass.apk"

      - name: Download SimplePlayer APK
        shell: bash
        run: |
          set -euo pipefail
          url=$(curl -fsSL https://api.github.com/repos/ZoKLav/SimplePlayer/releases/latest | jq -r '.assets[] | select(.name|endswith(".apk")) | .browser_download_url' | head -n1)
          if [ -n "$url" ] && [ "$url" != "null" ]; then curl -fL "$url" -o "$OUT_DIR/SimplePlayer.apk"; fi

      - name: Download Timbra APK
        shell: bash
        run: |
          set -euo pipefail
          url=$(curl -fsSL https://api.github.com/repos/fulalas/timbra/releases/latest | jq -r '.assets[] | select(.name|endswith(".apk")) | .browser_download_url' | head -n1)
          if [ -n "$url" ] && [ "$url" != "null" ]; then curl -fL "$url" -o "$OUT_DIR/Timbra.apk"; fi

      - name: Record file hashes
        shell: bash
        run: |
          cd "$OUT_DIR"
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh > FILES.txt

      - name: Upload APK bundle
        uses: actions/upload-artifact@v4
        with:
          name: reference-apks
          path: reference-apks/
          retention-days: 1
          if-no-files-found: error
